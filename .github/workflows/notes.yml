name: notes
on:
  pull_request_target:
    types: [labeled]
jobs:
  build:
    if: github.event.label.name == 'ready'
    runs-on: ubuntu-latest
    steps:
      - name: info
        env:
          NOTES_KEY: ${{ secrets.NOTES_KEY }}
          RUN_ACTOR: ${{ github.actor }}
          RUN_TRIGGER: ${{ github.triggering_actor }}
          LABEL_SENDER: ${{ github.event.sender.login }}
        run: |
          echo "actor=$RUN_ACTOR triggering=$RUN_TRIGGER sender=$LABEL_SENDER"
          printf '%s' "$NOTES_KEY" | sha256sum
